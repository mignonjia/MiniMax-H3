# 8-node DF fine-tune of released H3 (FL2VA) into a chunk-causal model, own-caption window, on public
# data: DiffSynth H3 renders (T2VA subset, 7 chunks each) with Qwen3-VL per-chunk captions.
# ~8.5k clips / 64 ranks = ~133 steps per epoch.
data_dirs: [/mnt/weka/shrd/wm/mingjia/data/h3_causal/diffsynth_t2va_480p]
holdout: 64
max_chunks: 7
window_chunks: 8
caption_window_chunks: 1
text_timestep: 1.0
num_train_timesteps: 1000
audio_loss_weight: 1.0
lr: 1.0e-5
warmup_steps: 100
max_steps: 2000
min_lr_ratio: 0.3
grad_clip: 1.0
ema_decay: 0.99
ema_start_step: 200
hsdp_shard_size: 16
output_dir: /mnt/weka/shrd/wm/mingjia/wm_checkpoints/h3_causal
run_name: df_8n_diffsynth
save_every: 250
keep_last: 1
export_every: 500
wandb_project: h3-causal
